version: "3.1"

rules:
- rule: Activate custom package form
  steps:
    - intent: request_custom_package
    - action: action_reset_custom_package_slots
    - action: package_custom_form
    - active_loop: package_custom_form

- rule: Submit custom package form
  condition:
    - active_loop: package_custom_form
  steps:
    - action: package_custom_form
    - active_loop: null
    - slot_was_set:
        - requested_slot: null
    - action: utter_package_form_ack
    - action: action_recommend_package

- rule: Smart fallback
  steps:
    - intent: nlu_fallback
    - action: action_smart_response

- rule: Respond to bot challenge
  steps:
    - intent: bot_challenge
    - action: utter_iamabot
