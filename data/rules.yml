version: "3.1"

rules:

- rule: Say goodbye in Arabic
  steps:
  - intent: goodbye_ar
  - action: utter_goodbye_ar

- rule: Say goodbye in English
  steps:
  - intent: goodbye_en
  - action: utter_goodbye_en

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot
