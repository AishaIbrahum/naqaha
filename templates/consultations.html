   <!--<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستشارة الطبية</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .form-container {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 1rem;
        }

        .required {
            color: #e53e3e;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #4facfe;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
            transform: translateY(-1px);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        .radio-option:hover {
            border-color: #4facfe;
            background-color: #f0f9ff;
        }

        .radio-option input[type="radio"] {
            width: auto;
            margin: 0;
        }

        .radio-option input[type="radio"]:checked + span {
            color: #4facfe;
            font-weight: 600;
        }

        .contact-methods {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .contact-method {
            flex: 1;
            padding: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        .contact-method:hover {
            border-color: #4facfe;
            background-color: #f0f9ff;
        }

        .contact-method.selected {
            border-color: #4facfe;
            background-color: #4facfe;
            color: white;
        }

        .contact-method i {
            font-size: 2rem;
            margin-bottom: 10px;
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .icon {
            margin-left: 8px;
            color: #4facfe;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            font-weight: 600;
            position: relative;
        }

        .step.active {
            background-color: #4facfe;
            color: white;
        }

        .step.completed {
            background-color: #48bb78;
            color: white;
        }

        .step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 50%;
            right: -20px;
            width: 20px;
            height: 2px;
            background-color: #e2e8f0;
            transform: translateY(-50%);
        }

        .step.completed:not(:last-child)::after {
            background-color: #48bb78;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
            
            .contact-methods {
                flex-direction: column;
            }
            
            .radio-group {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .form-container {
                padding: 20px;
            }
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 40px;
            color: #48bb78;
        }

        .success-message i {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .success-message h2 {
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-stethoscope"></i> الاستشارة الطبية</h1>
            <p>احصل على استشارة طبية متخصصة من أطباء مؤهلين</p>
        </div>

        <div class="step-indicator">
            <div class="step active">1</div>
            <div class="step">2</div>
            <div class="step">3</div>
        </div>

        <div class="form-container">
            <form id="consultationForm" action="/consultation" method="POST">
               معلومات أساسية 
                <div class="form-step active">
                    <h3 style="margin-bottom: 25px; color: #4a5568; font-size: 1.5rem;">
                        <i class="fas fa-user icon"></i>المعلومات الأساسية
                    </h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="specialization">
                                <i class="fas fa-medical-bag icon"></i>التخصص المطلوب
                            </label>
                            <select id="specialization" name="specialization" required>
                                <option value="">اختر التخصص</option>
                                <option value="internal_medicine">الطب الباطني</option>
                                <option value="pediatrics">طب الأطفال</option>
                                <option value="cardiology">أمراض القلب</option>
                                <option value="dermatology">الجلدية</option>
                                <option value="orthopedics">العظام</option>
                                <option value="gynecology">أمراض النساء</option>
                                <option value="psychiatry">الطب النفسي</option>
                                <option value="neurology">الأعصاب</option>
                                <option value="general">عام</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="question_for">
                                <i class="fas fa-question-circle icon"></i>الاستشارة لـ
                            </label>
                            <div class="radio-group">
                                <div class="radio-option">
                                    <input type="radio" id="for_me" name="question_for" value="myself" required>
                                    <span>نفسي</span>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" id="for_other" name="question_for" value="other">
                                    <span>شخص آخر</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="gender">
                                <i class="fas fa-venus-mars icon"></i>الجنس <span class="required">*</span>
                            </label>
                            <div class="radio-group">
                                <div class="radio-option">
                                    <input type="radio" id="male" name="gender" value="male" required>
                                    <span>ذكر</span>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" id="female" name="gender" value="female">
                                    <span>أنثى</span>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="age">
                                <i class="fas fa-birthday-cake icon"></i>العمر <span class="required">*</span>
                            </label>
                            <input type="number" id="age" name="age" min="1" max="120" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone_number">
                            <i class="fas fa-phone icon"></i>رقم الجوال <span class="required">*</span>
                        </label>
                        <input type="tel" id="phone_number" name="phone_number" placeholder="05xxxxxxxx" required>
                    </div>
                </div>

                 الأسئلة الطبية 
                <div class="form-step">
                    <h3 style="margin-bottom: 25px; color: #4a5568; font-size: 1.5rem;">
                        <i class="fas fa-notes-medical icon"></i>التفاصيل الطبية
                    </h3>

                    <div class="form-group">
                        <label for="question">
                            <i class="fas fa-question icon"></i>السؤال الطبي <span class="required">*</span>
                        </label>
                        <textarea id="question" name="question" placeholder="اكتب سؤالك الطبي بوضوح..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="description">
                            <i class="fas fa-file-medical-alt icon"></i>وصف مفصل للحالة
                        </label>
                        <textarea id="description" name="description" placeholder="اكتب وصفاً مفصلاً للأعراض أو الحالة الطبية..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="medical_history">
                            <i class="fas fa-history icon"></i>التاريخ المرضي
                        </label>
                        <textarea id="medical_history" name="medical_history" placeholder="أي أمراض مزمنة، عمليات سابقة، أدوية حالية..."></textarea>
                    </div>
                </div>

                طريقة التواصل 
                <div class="form-step">
                    <h3 style="margin-bottom: 25px; color: #4a5568; font-size: 1.5rem;">
                        <i class="fas fa-phone-alt icon"></i>طريقة التواصل المفضلة
                    </h3>

                    <div class="contact-methods">
                        <div class="contact-method" data-method="WhatsApp">
                            <i class="fab fa-whatsapp"></i>
                            <div>واتساب</div>
                            <small>رد سريع عبر الرسائل</small>
                        </div>
                        <div class="contact-method" data-method="Call">
                            <i class="fas fa-phone-alt"></i>
                            <div>مكالمة هاتفية</div>
                            <small>استشارة مباشرة</small>
                        </div>
                    </div>
                    <input type="hidden" id="contact_method" name="contact_method" required>

                    <button type="submit" class="submit-btn">
                        <i class="fas fa-paper-plane"></i>
                        إرسال الاستشارة
                    </button>
                </div>

                <div class="success-message" id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    <h2>تم إرسال الاستشارة بنجاح!</h2>
                    <p>سيتم التواصل معك قريباً من قبل الطبيب المختص</p>
                </div>
            </form>
        </div>
    </div>

    <script>
        // إدارة خطوات النموذج
        l// إدارة خطوات النموذج
            let currentStep = 0;
            const steps = document.querySelectorAll('.form-step');
            const stepIndicators = document.querySelectorAll('.step');

            function showStep(n) {
                steps.forEach((step, index) => {
                    step.style.display = index === n ? 'block' : 'none';
                });
                
                stepIndicators.forEach((indicator, index) => {
                    indicator.classList.remove('active', 'completed');
                    if (index < n) indicator.classList.add('completed');
                    if (index === n) indicator.classList.add('active');
                });
            }

            // التنقل بين الخطوات عند ملء الحقول المطلوبة
            document.addEventListener('change', function(e) {
                if (currentStep === 0) {
                    const requiredFields = ['specialization', 'question_for', 'gender', 'age', 'phone_number'];
                    const filled = requiredFields.every(field => {
                        const input = document.querySelector(`[name="${field}"]`);
                        if (input.type === 'radio') {
                            return document.querySelector(`[name="${field}"]:checked`);
                        }
                        return input.value.trim() !== '';
                    });
                    
                    if (filled) {
                        setTimeout(() => {
                            currentStep = 1;
                            showStep(currentStep);
                        }, 500);
                    }
                } else if (currentStep === 1) {
                    const question = document.getElementById('question').value.trim();
                    if (question !== '') {
                        setTimeout(() => {
                            currentStep = 2;
                            showStep(currentStep);
                        }, 500);
                    }
                }
            });

            // اختيار طريقة التواصل
            document.querySelectorAll('.contact-method').forEach(method => {
                method.addEventListener('click', function() {
                    document.querySelectorAll('.contact-method').forEach(m => m.classList.remove('selected'));
                    this.classList.add('selected');
                    document.getElementById('contact_method').value = this.dataset.method;
                });
            });

            // إرسال النموذج
            document.getElementById('consultationForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                // التحقق من صحة البيانات
                if (!validateForm()) return;
                
                // إظهار رسالة التحميل
                const submitBtn = document.querySelector('.submit-btn');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
                submitBtn.disabled = true;
                
                // إرسال البيانات الفعلية إلى السيرفر
                const formData = new FormData(this);
                
                fetch('/consultation', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        // إظهار رسالة النجاح
                        document.querySelector('.form-container').style.display = 'none';
                        document.querySelector('.step-indicator').style.display = 'none';
                        document.getElementById('successMessage').style.display = 'block';
                        
                        // إعادة تعيين النموذج بعد 5 ثواني
                        setTimeout(() => {
                            this.reset();
                            currentStep = 0;
                            showStep(0);
                            document.querySelector('.form-container').style.display = 'block';
                            document.querySelector('.step-indicator').style.display = 'flex';
                            document.getElementById('successMessage').style.display = 'none';
                            submitBtn.innerHTML = originalText;
                            submitBtn.disabled = false;
                            
                            // إلغاء تحديد طريقة التواصل
                            document.querySelectorAll('.contact-method').forEach(m => m.classList.remove('selected'));
                        }, 5000);
                    } else {
                        // عرض رسالة الخطأ
                        alert(data.message || 'حدث خطأ في إرسال الاستشارة. يرجى المحاولة مرة أخرى.');
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    // في حالة الخطأ، إعادة الزر لحالته الأصلية
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    
                    // محاولة إرسال النموذج بالطريقة التقليدية كخطة احتياطية
                    if (confirm('حدث خطأ في الإرسال. هل تريد المحاولة مرة أخرى؟')) {
                        this.submit();
                    }
                });
            });

            function validateForm() {
                const requiredFields = ['specialization', 'question_for', 'gender', 'age', 'phone_number', 'question', 'contact_method'];
                
                for (let field of requiredFields) {
                    const input = document.querySelector(`[name="${field}"]`);
                    if (!input) continue;
                    
                    if (input.type === 'radio') {
                        if (!document.querySelector(`[name="${field}"]:checked`)) {
                            alert(`يرجى اختيار ${field === 'gender' ? 'الجنس' : field === 'question_for' ? 'نوع الاستشارة' : 'الحقل المطلوب'}`);
                            currentStep = 0; // العودة للخطوة الأولى
                            showStep(currentStep);
                            return false;
                        }
                    } else if (input.value.trim() === '') {
                        // تحديد الخطوة المناسبة بناءً على الحقل
                        if (['specialization', 'question_for', 'gender', 'age', 'phone_number'].includes(field)) {
                            currentStep = 0;
                        } else if (['question', 'description', 'medical_history'].includes(field)) {
                            currentStep = 1;
                        } else if (field === 'contact_method') {
                            currentStep = 2;
                        }
                        showStep(currentStep);
                        
                        const fieldLabel = input.labels ? input.labels[0].textContent.replace('*', '').trim() : field;
                        alert(`يرجى ملء حقل ${fieldLabel}`);
                        input.focus();
                        return false;
                    }
                }
                
                // التحقق من رقم الجوال السعودي
                const phone = document.getElementById('phone_number').value;
                if (!/^05\d{8}$/.test(phone)) {
                    alert('يرجى إدخال رقم جوال سعودي صحيح يبدأ بـ 05 ويتكون من 10 أرقام');
                    currentStep = 0;
                    showStep(currentStep);
                    document.getElementById('phone_number').focus();
                    return false;
                }
                
                // التحقق من العمر
                const age = parseInt(document.getElementById('age').value);
                if (isNaN(age) || age < 1 || age > 120) {
                    alert('يرجى إدخال عمر صحيح بين 1 و 120');
                    currentStep = 0;
                    showStep(currentStep);
                    document.getElementById('age').focus();
                    return false;
                }
                
                // التحقق من اختيار طريقة التواصل
                if (!document.getElementById('contact_method').value) {
                    alert('يرجى اختيار طريقة التواصل المفضلة');
                    currentStep = 2;
                    showStep(currentStep);
                    return false;
                }
                
                return true;
            }

            // إظهار الخطوة الأولى في البداية
            showStep(0);

            // إضافة تأثيرات بصرية
            document.querySelectorAll('input, textarea, select').forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'scale(1.02)';
                    this.parentElement.style.transition = 'transform 0.2s ease';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });

            // إضافة مؤشر للحقول المطلوبة
            document.addEventListener('DOMContentLoaded', function() {
                const requiredInputs = document.querySelectorAll('[required]');
                requiredInputs.forEach(input => {
                    if (input.labels && input.labels[0]) {
                        const label = input.labels[0];
                        if (!label.innerHTML.includes('<span class="required">')) {
                            label.innerHTML += ' <span class="required">*</span>';
                        }
                    }
                });
            });

            // معالجة زر الرجوع في المتصفح
            window.addEventListener('popstate', function(e) {
                if (currentStep > 0) {
                    e.preventDefault();
                    currentStep--;
                    showStep(currentStep);
                }
            });
                </script>
</body>
</html>
