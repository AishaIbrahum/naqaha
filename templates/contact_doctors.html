<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/consult_doctor.css') }}">
    <title>استشارة طبية</title>
    
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <button class="back-btn" onclick="history.back()">‹</button>
                <div class="header-title">
                    <h1 class="main-title">استشارة طبية</h1>
                    <p class="subtitle">خصوصيتك مضمونة 100%</p>
                </div>
                <div style="width: 40px;"></div>
            </div>
            <select class="specialization-dropdown" id="specialization" name="specialization">
                <option value="">اختر التخصص الطبي</option>
                <option value="general">طب عام</option>
                <option value="cardiology">أمراض القلب</option>
                <option value="dermatology">الأمراض الجلدية</option>
                <option value="orthopedics">جراحة العظام</option>
                <option value="pediatrics">طب الأطفال</option>
                <option value="gynecology">النساء والولادة</option>
                <option value="neurology">الأعصاب</option>
                <option value="psychiatry">الطب النفسي</option>
                <option value="ophthalmology">طب العيون</option>
                <option value="ent">الأنف والأذن والحنجرة</option>
                <option value="dentistry">طب الأسنان</option>
                <option value="internal">الطب الباطني</option>
            </select>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="form-container">
            <div class="info-banner">
                <div class="info-icon">🔒</div>
                <div class="info-text">
                    <strong>سرية تامة:</strong> لن يتم الإفصاح عن هويتك أو معلوماتك الشخصية للطبيب
                </div>
            </div>

            <form id="consultationForm" method="POST" action="{{ url_for('submit_consultation') }}">
                <div class="form-group">
                    <label class="form-label">
                        <span class="label-badge">مطلوب</span>
                        سؤالك الطبي
                        <div class="tooltip" style="display: inline;">
                            <span class="tooltip-icon">?</span>
                            <span class="tooltip-text">اكتب سؤالك بوضوح ودقة</span>
                        </div>
                    </label>
                    <textarea 
                        class="input-field" 
                        placeholder="مثال: ما هي أسباب تكون حب الشباب؟"
                        maxlength="200"
                        id="questionField"
                        name="question"
                        required
                    ></textarea>
                    <div class="char-counter">
                        <span class="required-msg" id="requiredMsg">حقل مطلوب</span>
                        <span class="char-count" id="questionCounter">0/200</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <span class="label-badge optional">اختياري</span>
                        وصف تفصيلي للأعراض
                    </label>
                    <textarea 
                        class="input-field" 
                        placeholder="اشرح الأعراض التي تعاني منها بالتفصيل..."
                        rows="4"
                        maxlength="500"
                        id="descriptionField"
                        name="description"
                    ></textarea>
                    <div class="char-counter">
                        <span></span>
                        <span class="char-count" id="descriptionCounter">0/500</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <span class="label-badge">مطلوب</span>
                        السؤال لمن؟
                    </label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="forMe" name="questionFor" value="myself" checked>
                            <label class="radio-label" for="forMe">لنفسي</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="forOther" name="questionFor" value="other">
                            <label class="radio-label" for="forOther">لشخص آخر</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <span class="label-badge">مطلوب</span>
                        النوع
                    </label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="male" name="gender" value="male" checked>
                            <label class="radio-label" for="male">ذكر</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="female" name="gender" value="female">
                            <label class="radio-label" for="female">أنثى</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <span class="label-badge">مطلوب</span>
                        العمر
                    </label>
                    <div class="age-input-group">
                        <input 
                            type="number" 
                            class="input-field age-input" 
                            placeholder="أدخل العمر"
                            name="age"
                            min="1" 
                            max="120"
                            required
                        >
                        <span class="age-suffix">سنة</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <span class="label-badge optional">اختياري</span>
                        التاريخ المرضي
                    </label>
                    <textarea 
                        class="input-field" 
                        placeholder="هل تعاني من أمراض مزمنة؟ هل تتناول أدوية بانتظام؟"
                        rows="3"
                        maxlength="300"
                        id="medicalHistory"
                        name="medicalHistory"
                    ></textarea>
                    <div class="char-counter">
                        <span></span>
                        <span class="char-count" id="historyCounter">0/300</span>
                    </div>
                </div>
                <!-- طريقة التواصل -->
                <div class="form-group">
                    <label class="form-label">
                        <span class="label-badge">مطلوب</span>
                        ما طريقتك المفضلة لتلقي الاجابة
                    </label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="whatsapp" name="contactMethod" value="Whatsapp" checked>
                            <label class="radio-label" for="whatsapp">Whatsapp</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="call" name="contactMethod" value="Call">
                            <label class="radio-label" for="call">مكالمة هاتفية</label>
                        </div>
                    </div>
                </div>

                <!-- رقم الجوال -->
                <div class="form-group">
                    <label class="form-label">رقم الجوال:</label>
                    <input type="text" name="phoneNumber" class="input-field">
                </div>


                <button type="submit" class="submit-btn">
                    <span style="position: relative; z-index: 1;">إرسال الاستشارة</span>
                </button>
            </form>
        </div>
    </div>

  <script src="{{ url_for('static', filename='js/consult_doctor.js') }}"></script>
</body>
</html>
