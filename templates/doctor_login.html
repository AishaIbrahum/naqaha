<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الأطباء - نقاهة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border-radius: 20px;
            box-shadow: 0 25px 45px rgba(15, 23, 42, 0.2);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.9rem;
            text-align: center;
            color: #1f2937;
        }

        p.subtitle {
            text-align: center;
            margin-bottom: 28px;
            color: #64748b;
            font-size: 0.95rem;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #1f2937;
            font-size: 0.92rem;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
            margin-bottom: 18px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #fff;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 30px rgba(37, 99, 235, 0.2);
        }

        .flash-messages {
            margin-bottom: 20px;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.92rem;
            margin-bottom: 12px;
        }

        .alert-success {
            background: #e6f4ea;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .alert-danger {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .alert-info {
            background: #dbeafe;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>دخول الأطباء</h1>
        <p class="subtitle">سجّل دخولك للوصول إلى الاستشارات المعيّنة لك</p>

        <div class="flash-messages">
            {% with messages = get_flashed_messages(with_categories=True) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <form action="{{ url_for('doctor_login') }}" method="POST">
            <label for="email">البريد الإلكتروني</label>
            <input id="email" type="email" name="email" placeholder="doctor@example.com" required>

            <label for="password">كلمة المرور</label>
            <input id="password" type="password" name="password" placeholder="********" required>

            {% if request.args.get('next') %}
                <input type="hidden" name="next" value="{{ request.args.get('next') }}">
            {% endif %}

            <button type="submit">تسجيل الدخول</button>
        </form>
    </div>
</body>
</html>
