{% extends "base.html" %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h1>تسجيل دخول الأدمن</h1>
    <p>استخدم بيانات الحساب للإشراف على طلبات الباقات والحجوزات.</p>

    <form action="{{ url_for('admin_login', next=next) }}" method="POST" class="auth-form">
      <div class="form-group">
        <label for="username">اسم المستخدم</label>
        <input id="username" type="text" name="username" required>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" name="password" required>
      </div>

      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}

      <button type="submit" class="btn-primary">دخول</button>
    </form>

    <div class="links">
      <span>ليس لديك حساب؟</span>
      <a href="{{ url_for('admin_register') }}">سجل الآن</a>
    </div>
  </div>
</section>

<style>
  .auth-section {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: 40px 20px;
    background: linear-gradient(135deg, rgba(0,168,168,0.08), rgba(0,128,128,0.12));
  }

  .auth-card {
    background: #fff;
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-lg);
    padding: 32px 28px;
    max-width: 420px;
    width: 100%;
    display: grid;
    gap: 18px;
  }

  .auth-card h1 {
    margin: 0;
    color: var(--text-primary);
    font-size: 1.8rem;
  }

  .auth-card p {
    margin: 0;
    color: var(--text-secondary);
  }

  .auth-form {
    display: grid;
    gap: 16px;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .form-group input {
    width: 100%;
    border-radius: 12px;
    border: 1px solid #cbd5f5;
    padding: 12px;
    font-size: 1rem;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 1rem;
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-primary:hover { opacity: 0.92; }

  .links {
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.95rem;
  }

  .links a {
    color: var(--secondary-color);
    text-decoration: none;
    font-weight: 600;
  }
</style>
{% endblock %}
