slots:
  budget:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: budget
      - type: from_text
        conditions:
          - active_loop: package_custom_form
            requested_slot: budget
  medical_need:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: medical_need
      - type: from_text
        conditions:
          - active_loop: package_custom_form
            requested_slot: medical_need
  preferred_city:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: preferred_city
      - type: from_text
        conditions:
          - active_loop: package_custom_form
            requested_slot: preferred_city
  selected_package:
    type: text
    influence_conversation: true
    mappings:
      - type: custom
  language_preference:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

forms:
  package_custom_form:
    required_slots:
      - medical_need
      - budget
      - preferred_city

responses:
  utter_greet_ar:
    - text: "أهلًا! 👋 معك مساعد نقاهة، كيف أقدر أساعدك اليوم؟"

  utter_greet_en:
    - text: "Hi! 👋 I’m Naqaha’s assistant. How can I help you today?"

  utter_prices_ar:
    - text: "الباقة الأساسية تبدأ من حوالي 8,500 ريال، الباقة المميزة من 12,000 ريال، والباقة الذهبية من 18,500 ريال تقريبًا. السعر النهائي يعتمد على خطة العلاج، ومدة الإقامة، والمدينة العلاجية."

  utter_prices_en:
    - text: "Our basic package starts around SAR 8,500, the premium from SAR 12,000, and the gold package from SAR 18,500. Final pricing depends on the treatment plan, length of stay, and destination city."

  utter_services_ar:
    - text: "كل باقاتنا تشمل فحوصات طبية شاملة، وإقامة فندقية أو طبية، ونقل من وإلى المطار والمستشفى، ومترجمًا طبيًا، وتأمين سفر، ومتابعة بعد العلاج لضمان استقرار حالتك."

  utter_services_en:
    - text: "Every package includes comprehensive medical tests, medical or hotel accommodation, airport and appointment transfers, a dedicated medical translator, travel insurance, and post-treatment follow-up."

  utter_package_types_ar:
    - text: "نقاهة تقدم ثلاث باقات: الأساسية للرعاية الضرورية، المميزة لراحة إضافية وخدمات لوجستية موسعة، والذهبية لتجربة علاجية فاخرة مع فريق رعاية مخصص."

  utter_package_types_en:
    - text: "Naqaha offers three tiers: the Basic package for essential care, the Premium package for added comfort and extended logistics, and the Gold package for a luxury medical journey with a dedicated care team."

  utter_package_customization_ar:
    - text: "نخصص الباقات حسب تشخيصك وميزانيتك، ويمكننا تعديل مستوى السكن، وعدد الفحوصات، وخيارات النقل، وحتى إضافة خدمات مرافقة أو جلسات إضافية."

  utter_package_customization_en:
    - text: "We tailor each package to your diagnosis and budget, adjusting accommodation level, number of tests, transportation, and optional companion or follow-up services."

  utter_package_comparison_ar:
    - text: "الباقة الأساسية تناسب الميزانية وتغطي الخدمات الضرورية، المميزة تضيف سكنًا أرقى ودعم ترجمة موسعًا وسرعة في جدولة المواعيد، بينما الذهبية توفر إقامة فاخرة، ومنسقًا شخصيًا، وخيارات سفر مرنة."

  utter_package_comparison_en:
    - text: "The Basic package fits budget-conscious needs with essential services, the Premium package adds upgraded lodging, extended translation, and faster scheduling, while the Gold package delivers luxury accommodation, a personal coordinator, and flexible travel arrangements."

  utter_company_portal_ar:
    - text: |
        بوابة الشركات (Company Portal)
        🎯 الهدف
        تمكّن الشركات الطبية أو المراكز المتعاقدة مع نقاهة من إدارة فرقها الطبية داخل المنصة من مكان واحد.
        ⚙️ الصلاحيات والقيود
        - الشركة تشوف بس الأطباء المرتبطين بـ companyId الخاص فيها.
        - ما تقدر تطلع على أطباء أو مواعيد شركات ثانية.
        - صلاحيات CRUD لإضافة أو تعديل أو تعطيل الأطباء في نطاق الشركة فقط.
        - ما تقدر تعدّل بيانات المرضى أو مواعيدهم، لكن تقدر تشوف ملخصات الأداء والتقارير.
        - تشوف إحصاءات إجمالية مثل عدد الأطباء، المواعيد القادمة، والحالات النشطة.
        🧱 الوظائف الرئيسية
        1. إدارة الأطباء
           - إضافة طبيب جديد مع الاسم، التخصص، البريد، الجوال، وحالة الحساب.
           - إنشاء حساب للطبيب مرتبط بالشركة وإرسال بيانات الدخول له.
           - تعديل بيانات الطبيب بدون تغيير الشركة المرتبطة.
           - تفعيل أو تعطيل حساب الطبيب بدون حذف تاريخه.
        2. لوحة الإحصاءات
           - بطاقات تلخيص سريعة لعدد الأطباء، المواعيد القادمة خلال الأسبوع، الأطباء النشطين، والمعطلين.
           - رؤية التقارير الأسبوعية لمتابعة التزام الفريق بسياسات الشركة.

  utter_partner_portal_ar:
    - text: |
        بوابة الشركاء (Partner Portal)
        🎯 الهدف
        تخدم مقدمي الخدمات المتعاقدين مثل المستشفيات، الفنادق العلاجية، والمختبرات لتنسيق عروضهم وباقات التعاون مع نقاهة.
        ⚙️ الصلاحيات والقيود
        - الشريك يقدر يوصل فقط للخدمات والباقات التابعة له.
        - ما يطلع على بيانات شركات أو شركاء آخرين.
        - يقدر يحدث عروضه ويوقفها مؤقتًا، لكن ما يعدّل محتوى قدمه شركاء غيره.
        - صلاحيات الاطلاع على مؤشرات الأداء المرتبطة بالعقود ضد أهداف الجودة المتفق عليها.
        🧱 الوظائف الرئيسية
        1. إدارة الخدمات المشتركة
           - إضافة أو تحديث تفاصيل الباقات المشتركة، الأسعار، الطاقة الاستيعابية، والسياسات.
           - رفع المواد الداعمة والعروض الترويجية المرتبطة بكل خدمة.
        2. متابعة الطلبات والتقارير
           - لوحة متابعة لحجوزات الباقات المرتبطة بالشريك وحالتها الحالية.
           - تقارير أداء تبرز معدلات الإشغال، الطلبات القادمة، والتنبيهات حول التزامات الخدمة.
        3. التنسيق مع فريق نقاهة
           - مساحة مخصصة لتلقي المهام والملاحظات من فريق الحسابات في نقاهة.
           - توثيق التعديلات المتفق عليها على الباقات مع سجل زمني واضح.

  utter_doctor_portal_ar:
    - text: |
        بوابة الأطباء (Doctor Portal)
        🎯 الهدف
        تضمن للطبيب إدارة الاستشارات والمواعيد والتنبيهات المرتبطة بمرضاه عبر قناة موحدة مع نقاهة.
        ⚙️ الصلاحيات والقيود
        - الطبيب يشوف فقط ملفه الشخصي والاستشارات المعينة له.
        - ما يقدر يطلع على بيانات مرضى تابعين لأطباء آخرين.
        - يقدر يحدث حالة الاستشارة، يرفع ملاحظات، ويحدّث توافره، لكنه ما يعدّل بيانات المستخدمين الشخصية.
        - الوصول مقيد بالحالة: الطبيب المعطل ما يقدر يدخل أو يستقبل مواعيد جديدة.
        🧱 الوظائف الرئيسية
        1. إدارة الاستشارات والمواعيد
           - استعراض قائمة الاستشارات حسب الحالة (قيد المعالجة، بانتظار الرد، مكتملة).
           - قبول أو إعادة توجيه الاستشارات مع تحديث الحالة وتوثيق الملاحظات الطبية.
        2. متابعة الأداء الشخصي
           - بطاقات تلخص عدد الاستشارات النشطة، المكتملة، والمهام العاجلة للأسبوع الحالي.
           - تنبيهات تلقائية للتذكير بالردود المطلوبة أو المواعيد القادمة.
        3. ضبط الملف الطبي
           - تحديث التخصص، بيانات الاتصال، وتحديد فترات التوفر لاستقبال الحالات.
           - أرشفة سجل الردود والتوصيات لسهولة الرجوع والمتابعة مع فريق نقاهة.

  utter_goodbye_ar:
    - text: "سعدت بخدمتك! مع السلامة 🌸"

  utter_goodbye_en:
    - text: "It was a pleasure assisting you! Goodbye 🌸"
    
  utter_iamabot:
    - text: "أنا مساعد ذكي مبني بواسطة Rasa 🤖 وأخدمك عبر نقاهة 🌿\nI’m an intelligent assistant built with Rasa 🤖 and I serve you through Naqaha 🌿"

  utter_ask_medical_need:
    - text: "To tailor the right package, could you describe the medical need or procedure you are planning? / لو تكرمت صف احتياجك الطبي أو الإجراء المطلوب."

  utter_ask_budget:
    - text: "What budget range should we stay within (for example SAR 12000)? / ما هو نطاق الميزانية التقريبية (مثال: 12000 ريال)؟"

  utter_ask_preferred_city:
    - text: "Which city would you prefer for treatment or recovery? / أي مدينة تفضل للعلاج أو فترة النقاهة؟"

  utter_package_form_ack:
    - text: "جميل! سأستخدم هذه التفاصيل لأرشح لك باقة مناسبة. / Great! I'll use these details to recommend a tailored package for you."

actions:
  - action_smart_response
  - action_recommend_package
  - action_reset_custom_package_slots
  - validate_package_custom_form

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
